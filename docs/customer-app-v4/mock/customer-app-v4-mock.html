<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BrandBasket Customer App</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"><style>/* BrandBasket customer app, design system v4 ("Basket").
   Layout concept: a calm managed-service workspace. Left sidebar, 56px top bar, one page column of panels,
   a right inspector for any record. Tables for records, a metric strip for summaries, one primary action per screen.
   Derived from idraft's system (tokens, tonal layers, hairlines, honest numbers), tuned for business owners:
   15px body, 40px controls, 48px rows, plain words. Light theme only (owner rule). */

:root {
  /* Surfaces */
  --canvas: #F6F7F9;
  --sidebar: #F1F3F6;
  --surface: #FFFFFF;
  --surface-subtle: #F6F7F9;
  --surface-hover: #EFF1F4;
  --surface-selected: #EAF1FE;
  --surface-disabled: #F0F2F5;
  /* Text */
  --ink: #111418;
  --ink-2: #3F4650;
  --ink-3: #5B6370;
  --ink-muted: #8B93A0;
  --ink-disabled: #B4BAC4;
  --on-primary: #FFFFFF;
  /* Lines */
  --border: #E3E6EB;
  --border-subtle: #ECEEF2;
  --border-strong: #8B93A0;
  --border-control: #8B93A0;
  --border-button: #D6DAE1;
  --border-button-hover: #C6CBD4;
  /* Primary action and accent: cobalt, the one accent hue. Rattan stays only as the Website service mark. */
  --primary: #1E65E3;
  --primary-hover: #1A56C4;
  --accent: #1E65E3;
  --accent-text: #175AD0;
  --accent-wash: #EAF1FE;
  --accent-border: #B5CCF6;
  --ring: #1E65E3;
  /* Meaning */
  --pos-text: #17703F; --pos-wash: #E6F4EC; --pos-border: #B9DFC8;
  --neg-text: #B42318; --neg-wash: #FDECEA; --neg-border: #F4C3BE;
  --warn-text: #8A5300; --warn-wash: #FDF1DC; --warn-border: #F0D299;
  --info-text: #2456A6; --info-wash: #E9F0FB; --info-border: #BBD0F0;
  --neutral-text: #434B57; --neutral-wash: #EEF0F3;
  /* Service marks and chart series (series 1 is always the customer's own business) */
  --svc-site: #B87F3D; --svc-social: #1F7A74; --svc-search: #3558A0;
  --c1: #1E65E3; --c2: #1F7A74; --c3: #3558A0; --c-ref: #8B93A0; --grid: #ECEEF2;
  /* Shape and depth: panels 10, controls 8, badges 6; shadows on overlays only */
  --r-panel: 12px; --r-ctl: 8px; --r-badge: 6px;
  --sh-pop: 0 1px 2px rgb(17 20 24 / .06), 0 6px 16px rgb(17 20 24 / .10);
  --sh-dialog: 0 2px 4px rgb(17 20 24 / .06), 0 16px 40px rgb(17 20 24 / .16);
  --sh-inspector: 0 0 0 1px var(--border), 0 12px 40px rgb(17 20 24 / .14);
  --scrim: rgb(17 20 24 / .36);
  /* Type */
  --f-text: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  /* Sizes */
  --w-sidebar: 232px; --h-top: 52px; --h-ctl: 36px; --h-ctl-sm: 30px; --h-row: 44px; --w-insp: 440px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 14px/20px var(--f-text); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums; letter-spacing: -0.003em; }
h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent-text); text-underline-offset: 3px; }
svg.i { width: 18px; height: 18px; flex: none; fill: currentColor; }
svg.i.s { width: 16px; height: 16px; }
svg.i.l { width: 24px; height: 24px; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 13px; }

/* Type utilities (the only text styles used) */
.t-title { font: 600 22px/28px var(--f-display); letter-spacing: -.022em; }
.t-section { font: 600 14px/20px var(--f-display); letter-spacing: -.006em; }
.t-sub { font: 500 14px/20px var(--f-text); }
.t-body { font: 400 14px/20px var(--f-text); }
.t-strong { font-weight: 500; }
.t-meta { font: 400 13px/18px var(--f-text); color: var(--ink-3); }
.t-metric { font: 600 24px/30px var(--f-display); letter-spacing: -.025em; }
.t-metric-sm { font: 600 16px/22px var(--f-display); letter-spacing: -.015em; }
.muted { color: var(--ink-3); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--w-sidebar) minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: 0; height: 100vh; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px 8px; gap: 8px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 8px; }
.brand svg { height: 26px; width: auto; }
.biz { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-ctl); text-align: left; }
.biz .av { width: 28px; height: 28px; font-size: 12px; }
.biz b { display: block; font: 600 14px/18px var(--f-text); }
.biz span { font-size: 12.5px; color: var(--ink-3); line-height: 16px; }
.biz .i { margin-left: auto; color: var(--ink-muted); }
.search-btn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-ctl); color: var(--ink-3); width: 100%; text-align: left; font-size: 14px; }
.search-btn kbd { margin-left: auto; }
kbd { font: 500 11px/16px var(--f-text); background: var(--neutral-wash); color: var(--ink-3); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font: 500 12.5px/16px var(--f-text); color: var(--ink-3); padding: 14px 10px 4px; }
.nav-i { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: var(--r-ctl); color: var(--ink-2); text-decoration: none; font: 500 14.5px/20px var(--f-text); background: none; border: 0; width: 100%; text-align: left; }
.nav-i:hover { background: var(--surface-hover); }
.nav-i[aria-current="page"] { background: var(--surface-selected); color: var(--ink); font-weight: 600; }
.nav-i[aria-current="page"] .i { color: var(--accent-text); }
.nav-i .mk { width: 8px; height: 8px; border-radius: 2px; margin-left: auto; }
.nav-i .cnt { margin-left: auto; font: 600 12px/18px var(--f-text); min-width: 20px; text-align: center; padding: 0 6px; border-radius: 10px; background: var(--warn-wash); color: var(--warn-text); border: 1px solid var(--warn-border); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--border); }
.me { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-ctl); width: 100%; text-align: left; background: none; border: 0; }
.me:hover { background: var(--surface-hover); }
.me b { display: block; font: 600 14px/18px var(--f-text); }
.me span { font-size: 12.5px; color: var(--ink-3); }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--neutral-wash); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; font: 600 13px/1 var(--f-text); flex: none; border: 1px solid var(--border); }
.av.acc { background: var(--accent-wash); color: var(--accent-text); border-color: var(--accent-border); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; height: var(--h-top); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-3); min-width: 0; }
.crumbs b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.crumbs .i { color: var(--ink-muted); width: 14px; height: 14px; }
.top .grow { flex: 1; }
.top .search-btn { width: 320px; }
.phone-only { display: none; }

.page { padding: 24px 32px 96px; width: 100%; max-width: 1240px; margin: 0 auto; }
.ph { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.ph .tx { flex: 1; min-width: 240px; }
.ph .t-meta { margin-top: 2px; font-size: 14px; }
.ph .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.grid2b { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.sp { flex: 1; }

/* ---------- Panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-panel); }
.panel > .hd { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; border-bottom: 1px solid var(--border-subtle); }
.panel > .hd .t-section { flex: 1; min-width: 0; }
.panel > .bd { padding: 16px; }
.panel > .bd.flush { padding: 0; }
.panel > .ft { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border-subtle); font-size: 14px; color: var(--ink-3); }
.well { background: var(--surface-subtle); border: 1px solid var(--border-subtle); border-radius: var(--r-ctl); padding: 12px; }

/* Metric strip: one panel, cells split by hairlines */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-panel); }
.strip > div { padding: 14px 18px; min-width: 0; border-left: 1px solid var(--border); }
.strip > div:first-child { border-left: 0; }
.strip .lb { font-size: 13.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.strip .vl { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
.strip .cx { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.delta { font: 600 13.5px/18px var(--f-text); }
.delta.up { color: var(--pos-text); } .delta.down { color: var(--neg-text); } .delta.flat { color: var(--ink-3); }

/* ---------- Buttons and controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--h-ctl); padding: 0 16px; border-radius: var(--r-ctl); border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: 600 14.5px/20px var(--f-text); text-decoration: none; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-hover); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.danger { color: var(--neg-text); border-color: var(--neg-border); }
.btn.danger:hover { background: var(--neg-wash); }
.btn.sm { height: var(--h-ctl-sm); padding: 0 12px; font-size: 13.5px; }
.btn.lg { height: 44px; padding: 0 20px; }
.btn:disabled { color: var(--ink-disabled); background: var(--surface-disabled); border-color: var(--border); cursor: not-allowed; }
.ibtn { width: var(--h-ctl-sm); height: var(--h-ctl-sm); display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-ctl); border: 0; background: none; color: var(--ink-3); }
.ibtn:hover { background: var(--surface-hover); color: var(--ink); }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font: 600 14px/20px var(--f-text); color: var(--ink); }
.field .hint { font-size: 13px; color: var(--ink-3); }
.field .err { font-size: 13px; color: var(--neg-text); display: flex; gap: 6px; align-items: center; }
.inp, .sel, .txa { width: 100%; height: var(--h-ctl); padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); font: 400 15px/22px var(--f-text); }
.txa { height: auto; padding: 10px 12px; min-height: 96px; resize: vertical; }
.inp:focus, .sel:focus, .txa:focus { outline: 2px solid var(--ring); outline-offset: 0; border-color: var(--ring); }
.inp.bad { border-color: var(--neg-text); }
.inp::placeholder { color: var(--ink-muted); }
.inp-wrap { position: relative; }
.inp-wrap .i { position: absolute; left: 10px; top: 12px; color: var(--ink-muted); }
.inp-wrap .inp { padding-left: 36px; }
.sel { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 18px) 17px, calc(100% - 13px) 17px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.chk input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.tog { position: relative; width: 40px; height: 24px; flex: none; }
.tog input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.tog i { position: absolute; inset: 0; background: var(--border-strong); border-radius: 12px; transition: background .12s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform .12s; }
.tog input:checked + i { background: var(--primary); }
.tog input:checked + i::after { transform: translateX(16px); }
.tog input:focus-visible + i { outline: 2px solid var(--ring); outline-offset: 2px; }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); overflow: hidden; }
.seg button { height: 36px; padding: 0 14px; border: 0; border-left: 1px solid var(--border); background: none; font: 500 14px/20px var(--f-text); color: var(--ink-2); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--surface-selected); color: var(--accent-text); font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); font: 500 14px/20px var(--f-text); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface-hover); }
.chip[aria-pressed="true"] { background: var(--surface-selected); border-color: var(--accent-border); color: var(--accent-text); font-weight: 600; }
.chip .n { color: var(--ink-3); font-weight: 500; }

.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--border); margin: -4px 0 20px; overflow-x: auto; scrollbar-width: none; }
.tabs button { height: 44px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: none; font: 500 15px/20px var(--f-text); color: var(--ink-3); white-space: nowrap; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs .n { font: 600 12px/18px var(--f-text); padding: 0 6px; border-radius: 10px; background: var(--neutral-wash); color: var(--neutral-text); }

/* ---------- Badges, status ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--r-badge); font: 600 12.5px/16px var(--f-text); background: var(--neutral-wash); color: var(--neutral-text); border: 1px solid transparent; white-space: nowrap; }
.badge .i { width: 14px; height: 14px; }
.badge.pos { background: var(--pos-wash); color: var(--pos-text); border-color: var(--pos-border); }
.badge.neg { background: var(--neg-wash); color: var(--neg-text); border-color: var(--neg-border); }
.badge.warn { background: var(--warn-wash); color: var(--warn-text); border-color: var(--warn-border); }
.badge.info { background: var(--info-wash); color: var(--info-text); border-color: var(--info-border); }
.badge.acc { background: var(--accent-wash); color: var(--accent-text); border-color: var(--accent-border); }
.svc { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.svc::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--ink-muted)); }
.svc.site { --c: var(--svc-site); } .svc.social { --c: var(--svc-social); } .svc.search { --c: var(--svc-search); }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
.tbl th { text-align: left; font: 500 12.5px/16px var(--f-text); letter-spacing: .02em; color: var(--ink-3); background: var(--surface-subtle); height: 40px; padding: 0 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { height: var(--h-row); padding: 8px 16px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr[data-open] { cursor: pointer; }
.tbl tbody tr[data-open]:hover td { background: var(--surface-hover); }
.tbl tbody tr.sel td { background: var(--surface-selected); }
.tbl td .sub { display: block; font-size: 13px; color: var(--ink-3); }
.tbl .r { text-align: right; }
.tbl .strong { font-weight: 600; }
.tbl td.unread::before { content: ""; }
.tbl-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 14px; color: var(--ink-3); }

/* ---------- Lists, bars, steps ---------- */
.rows > * { padding: 12px 16px; border-top: 1px solid var(--border-subtle); }
.rows > *:first-child { border-top: 0; }
.li { display: flex; align-items: center; gap: 12px; }
.li .ico { width: 36px; height: 36px; border-radius: var(--r-ctl); background: var(--neutral-wash); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.li .ico.acc { background: var(--accent-wash); color: var(--accent-text); }
.li .ico.pos { background: var(--pos-wash); color: var(--pos-text); }
.li .ico.warn { background: var(--warn-wash); color: var(--warn-text); }
.li .tx { flex: 1; min-width: 0; }
.li .tx > b { display: block; font: 600 15px/20px var(--f-text); }
.li .tx > span { display: block; font-size: 13.5px; color: var(--ink-3); }
.barlist { display: flex; flex-direction: column; gap: 14px; }
.barlist .b { display: grid; grid-template-columns: 120px minmax(0, 1fr) 56px; align-items: center; gap: 12px; font-size: 14px; }
.barlist .b .tr { height: 20px; background: transparent; }
.barlist .b i { display: block; height: 20px; background: var(--bar, var(--c1)); border-radius: 3px; }
.barlist .b .v { text-align: right; font-weight: 600; }
.meter { height: 8px; background: var(--neutral-wash); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c1); }
.meter.pos i { background: var(--pos-text); }
.stepper { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; }
.stepper .st { position: relative; padding-top: 22px; font-size: 13.5px; color: var(--ink-3); }
.stepper .st::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 2px; background: var(--border); }
.stepper .st::after { content: ""; position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border-strong); }
.stepper .st.done::before { background: var(--c1); } .stepper .st.done::after { background: var(--c1); border-color: var(--c1); }
.stepper .st.now::after { border-color: var(--c1); background: var(--accent-wash); }
.stepper .st b { display: block; color: var(--ink); font-weight: 600; }
.timeline { display: flex; flex-direction: column; }
.timeline .ev { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding: 0 0 16px; position: relative; }
.timeline .ev::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: 0; width: 1px; background: var(--border); }
.timeline .ev:last-child::before { display: none; }
.timeline .ev .i { color: var(--ink-3); margin-top: 1px; }
.timeline .ev b { font-weight: 600; }
.timeline .ev .t-meta { margin-top: 0; }

/* ---------- Banners, states ---------- */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-ctl); border: 1px solid var(--info-border); background: var(--info-wash); color: var(--ink); }
.banner .i { margin-top: 1px; color: var(--info-text); }
.banner.warn { background: var(--warn-wash); border-color: var(--warn-border); } .banner.warn .i { color: var(--warn-text); }
.banner.neg { background: var(--neg-wash); border-color: var(--neg-border); } .banner.neg .i { color: var(--neg-text); }
.banner.pos { background: var(--pos-wash); border-color: var(--pos-border); } .banner.pos .i { color: var(--pos-text); }
.banner .tx { flex: 1; min-width: 0; }

.empty { text-align: center; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; }

@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } * { transition: none !important; } }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }

.dialog { position: fixed; z-index: 42; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); border-radius: 12px; box-shadow: var(--sh-dialog); display: flex; flex-direction: column; overflow: hidden; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--r-ctl); box-shadow: var(--sh-pop); font-size: 14.5px; display: flex; gap: 8px; align-items: center; }
.save-bar { position: fixed; left: var(--w-sidebar); right: 0; bottom: 0; height: 56px; z-index: 30; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 32px; }

/* ---------- Charts ---------- */
.chart text { font: 400 12px var(--f-text); fill: var(--ink-3); }

.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }

/* ---------- Domain pieces ---------- */
.postcard { border: 1px solid var(--border); border-radius: var(--r-panel); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
.postcard .img { aspect-ratio: 4 / 3; background: var(--neutral-wash); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-subtle); }

.thread { display: flex; flex-direction: column; gap: 16px; }

.msg.me-m .txt { background: var(--surface-subtle); border: 1px solid var(--border-subtle); border-radius: var(--r-ctl); padding: 10px 12px; }
.next { border: 1px solid var(--accent-border); background: var(--accent-wash); border-radius: var(--r-panel); padding: 16px; display: flex; flex-direction: column; gap: 10px; }

.swatch { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); flex: none; }

.slot { padding: 8px 14px; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); background: var(--surface); font: 600 14px/20px var(--f-text); }
.slot[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.star { color: var(--accent); display: inline-flex; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 12px; font-size: 14.5px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-weight: 500; }
.where { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); }
.sect-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; padding: 20px 16px; border-top: 1px solid var(--border-subtle); }
.sect-grid:first-child { border-top: 0; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.sw { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.sw b { display: block; font-weight: 600; font-size: 13.5px; }
.review { position: fixed; right: 12px; bottom: 12px; z-index: 70; background: var(--ink); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; box-shadow: var(--sh-pop); max-width: calc(100vw - 24px); }

.rv-in { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 6px 0 4px; }

.review select { height: 28px; border-radius: 6px; border: 1px solid #4A5160; background: #1E2229; color: #fff; font: 500 12.5px var(--f-text); padding: 0 6px; }
.tabbar { display: none; }

/* ---------- Auth ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--surface); }
.auth .l { display: flex; align-items: center; justify-content: center; padding: 32px; }
.auth .l > div { width: min(400px, 100%); display: flex; flex-direction: column; gap: 16px; }
.auth .r { background: var(--sidebar); border-left: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 48px; }

}

  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; border: 0; background: none; font: 500 11.5px/14px var(--f-text); color: var(--ink-3); position: relative; justify-content: center; }

  .save-bar { left: 0; padding: 0 16px; bottom: 60px; }

  .auth { grid-template-columns: minmax(0, 1fr); } .auth .r { display: none; }

  .cal .d { min-height: 56px; } .cal .p { font-size: 0; padding: 0; height: 6px; }
}
@media (max-width: 520px) {

  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv dd { margin-bottom: 8px; }
  .ph .acts { width: 100%; } .ph .acts .btn { flex: 1; }
  .inp, .sel, .txa { font-size: 16px; }
}

/* Line chart: one scale places marks, ticks and labels. series: [{name,color,data,dash}] */
function lineChart(series, labels, o = {}) {
  const W = 640, H = o.h || 220, L = 44, R = 12, T = 12, B = 28;
  const all = series.flatMap((s) => s.data); let max = Math.max(...all), min = o.zero === false ? Math.min(...all) : 0;
  const step = o.step || niceStep((max - min) / 4); max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const x = (i, n) => L + (i * (W - L - R)) / (n - 1), y = (v) => T + (H - T - B) * (1 - (v - min) / (max - min));
  const ticks = []; for (let v = min; v <= max + 1e-9; v += step) ticks.push(v);
  const fmt = o.fmt || ((v) => v.toLocaleString("en-IN"));
  const lx = labels.map((l, i) => (i % Math.ceil(labels.length / 6) === 0 ? `<text x="${x(i, labels.length)}" y="${H - 8}" text-anchor="middle">${l}</text>` : "")).join("");
  const a0 = series[0].data, area = `<polygon fill="${series[0].color}" fill-opacity=".07" points="${x(0, a0.length).toFixed(1)},${y(min)} ${a0.map((v, i) => `${x(i, a0.length).toFixed(1)},${y(v).toFixed(1)}`).join(" ")} ${x(a0.length - 1, a0.length).toFixed(1)},${y(min)}"/>`;
  const lines = series.map((s) => `<polyline fill="none" stroke="${s.color}" stroke-width="1.75" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round" points="${s.data.map((v, i) => `${x(i, s.data.length).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}"/>`).join("");
  const last = series[0]; const ex = x(last.data.length - 1, last.data.length), ey = y(last.data[last.data.length - 1]);
  const tips = o.tip ? series[0].data.map((v, i) => `<circle cx="${x(i, series[0].data.length).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9" fill="transparent"><title>${o.tip(i, v)}</title></circle>`).join("") : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label || "Chart"}">${ticks.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join("")}${lx}${area}${lines}<circle cx="${ex}" cy="${ey}" r="4" fill="${last.color}" stroke="#fff" stroke-width="2"/>${tips}</svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
const spark = (d, c = "var(--c1)") => { const mx = Math.max(...d), mn = Math.min(...d); return `<svg class="spark" viewBox="0 0 72 24" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" points="${d.map((v, i) => `${(i * 72 / (d.length - 1)).toFixed(1)},${(22 - ((v - mn) / (mx - mn || 1)) * 20).toFixed(1)}`).join(" ")}"/></svg>`; };
const legend = (items) => `<div class="legend">${items.map(([n, c]) => `<span><i style="--c:${c}"></i>${n}</span>`).join("")}</div>`;
const barlist = (items, color) => `<div class="barlist">${items.map(([l, v, p]) => `<div class="b"><span>${l}</span><div class="tr"><i style="width:${p}%;--bar:${color || "var(--c1)"}"></i></div><span class="v">${v}</span></div>`).join("")}</div>`;

  }
  return "";
}

function renderDialog() {
  const x = `<button class="ibtn" data-close aria-label="Close">${ic("X")}</button>`;
  const wrap = (title, body, foot) => `<div class="dialog" role="dialog" tabindex="-1" aria-modal="true" aria-label="${title}"><div class="hd"><h2 class="t-section">${title}</h2>${x}</div><div class="bd">${body}</div><div class="ft">${foot}</div></div>`;
  switch (S.dialog) {
    case "newreq": return wrap("New request", `<div><div class="lbl" style="margin-bottom:8px">What is it about?</div><div class="chips">${["Change my website", "Send you something", "Ask a question", "Posts or ads", "Billing"].map((t, i) => `<button class="chip" aria-pressed="${i === 0}">${t}</button>`).join("")}</div></div>${field("nr1", "Which page or service?", { type: "select", opts: ["Home page", "Tests and packages", "Book a test", "New page", "Social & Ads", "Local SEO + AEO"] })}${field("nr2", "What should we do?", { type: "area", ph: "Say it the way you would tell a person." })}<div class="drop">${ic("UploadSimple", "l")}<b>Add screenshots or files</b><span class="t-meta">Optional. Up to 5 files, 10 MB each.</span></div><p class="t-meta">This month: 1 of 2 included edits used. If your request is bigger, we send a price first.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn primary" data-toast="Request sent. We reply within one working day.">Send request</button>`);
    case "book": return wrap("Book a call", `${field("bk1", "What is it about?", { type: "select", opts: ["Website", "Social & Ads", "Local SEO + AEO", "Billing", "Something else"] })}${field("bk2", "Anything we should look at first?", { type: "area", ph: "Optional" })}<div><div class="lbl" style="margin-bottom:8px">Pick a day</div><div class="chips">${["Wed 25 Nov", "Thu 26 Nov", "Fri 27 Nov", "More days"].map((d, i) => `<button class="chip" aria-pressed="${i === 1}">${d}</button>`).join("")}</div></div><div><div class="lbl" style="margin-bottom:8px">Times in India</div><div class="row wrap">${["10:00", "11:00", "12:30", "15:00", "16:30"].map((t) => `<button class="slot" aria-pressed="${t === "11:00"}">${t}</button>`).join("")}</div></div><p class="t-meta">30 minutes on video. The link comes by email and in a calendar invite.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn primary" data-book>Book Thu 26 Nov, 11:00</button>`);
    case "cancel": return wrap("Cancel a service", `<div class="banner warn">${ic("Warning")}<div class="tx"><b>Here is what happens.</b> The service stays active until your next billing date, Fri 27 Nov. After that your website goes offline and ads stop. We keep your content for 30 days.</div></div>${field("cx1", "Which service?", { type: "select", opts: ["Local SEO + AEO", "Social & Ads", "Managed Website"] })}${field("cx2", "Why are you leaving? (optional)", { type: "area" })}<p class="t-meta">Cancelling one service changes your package discount. Your new total would be ${inr(11698)} per month for the two that stay.</p>`, `<button class="btn" data-close>Keep my plan</button><button class="btn danger" data-toast="Cancellation scheduled for 27 Nov">Cancel from 27 Nov</button>`);
    case "payment": return wrap("Change payment method", `<p class="muted">You will go to Razorpay's secure page to add a new card or UPI. Your plan keeps running while you do.</p>`, `<button class="btn" data-close>Cancel</button><button class="btn primary" data-toast="Opens Razorpay">Continue to Razorpay</button>`);
    case "invite": return wrap("Invite someone", `${field("iv1", "Name", { ph: "Full name" })}${field("iv2", "Email", { ph: "name@business.in" })}${field("iv3", "Role", { type: "select", opts: ["Approver", "Viewer", "Owner"], hint: "Approvers can approve posts and quotes." })}`, `<button class="btn" data-close>Cancel</button><button class="btn primary" data-toast="Invitation sent">Send invitation</button>`);
    case "search": {
      const items = [["Home", "home"], ["New request", "newreq:dlg"], ["Enquiries", "enquiries"], ["Requests", "requests"], ["Website", "website"], ["Website: Pages", "website:pages"], ["Social & Ads", "social"], ["Social & Ads: Content", "social:content"], ["Local SEO + AEO", "search"], ["Reports", "reports"], ["Business profile", "business"], ["Plan & billing", "plan"], ["Invoices", "plan:invoices"], ["Settings", "settings"], ["Help & calls", "help"]];
      return `<div class="dialog" role="dialog" tabindex="-1" aria-label="Search"><div class="hd"><div class="inp-wrap" style="flex:1">${ic("MagnifyingGlass", "s")}<input class="inp" id="q" placeholder="Search pages, enquiries and requests" autofocus></div>${x}</div><div class="bd" style="padding:8px" id="qres">${items.map(([l, g]) => `<button class="nav-i" data-q="${l.toLowerCase()}" ${g.endsWith(":dlg") ? `data-dlg="${g.split(":")[0]}"` : `data-go="${g}"`}>${ic(g.endsWith(":dlg") ? "Plus" : "ArrowRight", "s")}${l}</button>`).join("")}</div></div>`;
    }
  }
  return "";
}
document.addEventListener("input", (e) => { if (e.target.id === "q") { const v = e.target.value.toLowerCase(); document.querySelectorAll("#qres [data-q]").forEach((b) => { b.hidden = !b.dataset.q.includes(v); }); } });

const h = location.hash.replace("#", ""); if (SCREENS[h]) S.screen = h; render();</script></body></html>
