# Shared proxy settings for both Brandbasket upstreams. Installed as /etc/nginx/snippets/brandbasket-proxy.conf by
# deploy/vps/install.sh nginx-https, included inside each `location` that proxies.
#
# Host is passed through untouched: both apps choose the dashboard or the console by the Host header (apps/platform/proxy.ts
# answers 404 for a host it does not recognise), so rewriting it makes every page 404.
#
# X-Forwarded-For is OVERWRITTEN with the real peer address, never appended to: the apps rate-limit and log by its first
# entry, so passing the browser's own value on would let anyone choose the address they are recorded under. Behind
# Cloudflare, $remote_addr is the visitor only where the server block includes snippets/cloudflare-realip.conf (both do).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# Retry only failures that happened before the app saw the request (never a POST that may have run).
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
# The app's response headers (a long Content-Security-Policy plus the Link preload list) can pass nginx's 4k default, which
# answers 502 "upstream sent too big header". 16k leaves room; the busy-buffer size must stay below the buffers' total.
proxy_buffer_size 16k;
proxy_buffers 4 16k;
proxy_busy_buffers_size 32k;
