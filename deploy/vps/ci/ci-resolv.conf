# DNS for the Brandbasket CI sandbox (bound over /etc/resolv.conf by brandbasket-ci-sandbox): the same public resolvers as
# Firstfold's sandbox. Not the local stub at 127.0.0.53, which also answers from the server's /etc/hosts.
nameserver 153.92.2.6
nameserver 8.8.8.8
nameserver 8.8.4.4
options timeout:2 attempts:2
