# Installed as <unit>.service.d/10-notify-failure.conf for each Brandbasket service that should email the team when it
# fails. brandbasket-notify-failure is Brandbasket's own handler (a copy of Firstfold's with every name changed): it sends through the
# Brevo settings in /srv/brandbasket/shared/platform.env.local, writes its rate-limit state under /var/lib/brandbasket, and
# does nothing but log while BREVO_API_KEY is blank. The subject reads "[Brandbasket server] <unit> failed".
[Unit]
OnFailure=brandbasket-notify-failure@%n.service
