# Installed as <unit>.service.d/10-notify-failure.conf for each Brandbasket service that should email the team when it
# fails. firstfold-notify-failure is generic (it takes any unit name and reads the journal of that unit); it sends through
# the Brevo settings in Firstfold's platform env file, so Brandbasket's own BREVO_API_KEY is not needed for alerts. The
# subject reads "[Firstfold server] <unit> failed", which is right: it is the server's alert, and the unit name says
# which project.
[Unit]
OnFailure=firstfold-notify-failure@%n.service
